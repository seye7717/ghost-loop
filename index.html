var AC = null, master = null, droneGain = null, droneOscs = [], hatBuf = null;
var mStep = 0, mNext = 0;
function initAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(AC.destination);
      var filt = AC.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = 220;
      droneGain = AC.createGain(); droneGain.gain.value = 0;
      var o1 = AC.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55;
      var o2 = AC.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 55.7;
      o1.connect(filt); o2.connect(filt);
      filt.connect(droneGain); droneGain.connect(master);
      o1.start(); o2.start();
      droneOscs = [o1, o2];
      var hl = Math.floor(AC.sampleRate * 0.03);
      hatBuf = AC.createBuffer(1, hl, AC.sampleRate);
      var hd = hatBuf.getChannelData(0);
      for (var i = 0; i < hl; i++) hd[i] = (Math.random() * 2 - 1) * (1 - i / hl);
      mNext = AC.currentTime;
    } catch (e) { AC = null; }

}
function setMuted(m) {

}
function beepAt(freq, dur, type, vol, when, slide) {
  if (!AC) return;
  try {
    var t = when || AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function beep(freq, dur, type, vol, slide, delay) {
  if (!AC) return;
  beepAt(freq, dur, type, vol, AC.currentTime + (delay || 0), slide);
}
function playHat(when, vol) {
  if (!AC || !hatBuf) return;
  try {
    var src = AC.createBufferSource();
    src.buffer = hatBuf;
    var g = AC.createGain(); g.gain.value = vol;
    var f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5000;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(when);
  } catch (e) {}
}

  if (!AC) return;

    var len = Math.floor(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource();
    src.buffer = buf;
    var g = AC.createGain(); g.gain.value = vol;
    var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  } catch (e) {}
}

function musicActive() {
  if (MUSIC[musicIndex].name === 'OFF') return false;
  if (state === 'menu' || state === 'levels') return true;
  if (state === 'playing' && !paused) return true;
  return false;

function musicTick() {
  if (!AC || muted) return;
  if (!musicActive() || musicIndex === 0) { mNext = AC.currentTime; mStep = 0; return; }
  var song = MUSIC[musicIndex].name;
  var stepDur = song === 'PULSE' ? 0.27 : 0.32;
  if (mNext < AC.currentTime - 0.5) mNext = AC.currentTime;
  while (mNext < AC.currentTime + 0.25) {
    if (song === 'PULSE') {
      var f = PULSE_BASS[mStep % 16];
      if (f > 0) beepAt(f, 0.24, 'sawtooth', 0.05, mNext);
      if (mStep % 2 === 1) playHat(mNext, 0.015);
      if (mStep % 16 === 0) beepAt(110, 0.5, 'triangle', 0.03, mNext);
      if (state === 'playing' && ghosts && ghosts.length >= 4 && mStep % 4 === 2) {
        beepAt(440, 0.12, 'square', 0.02, mNext);
      }
    } else {
      var a = PHANTOM_ARP[mStep % 12];
      beepAt(a, 0.3, 'triangle', 0.035, mNext);
      if (mStep % 12 === 0) beepAt(110, 1.0, 'sawtooth', 0.028, mNext);
      if (mStep % 12 === 6) beepAt(87.3, 1.0, 'sawtooth', 0.024, mNext);
    }
    mNext += stepDur;
    mStep++;
  }
}

var keys = {};

  keys[e.code] = true;

function setControlFromX(px) {
  if (!sliderRect) return;
  var v = 0.6 + (px - sliderRect.x) / sliderRect.w;
  controlF = Math.max(0.6, Math.min(1.6, v));
  try { localStorage.setItem('ghostloop_control', String(controlF)); } catch (e) {}
}
canvas.addEventListener('pointerdown', function (e) {
  initAudio();
  var rct = canvas.getBoundingClientRect();
  var px = e.clientX - rct.left, py = e.clientY - rct.top;
  for (var i = 0; i < buttons.length; i++) {
    var b = buttons[i];
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) { b.fn(); return; }
  }
  if (state === 'menu' && sliderRect && px >= sliderRect.x - 14 && px <= sliderRect.x + sliderRect.w + 14 && py >= sliderRect.y - 18 && py <= sliderRect.y + sliderRect.h + 18) {
    sliderDrag = true;
    setControlFromX(px);

  }
  if (state !== 'playing' || paused) { handleAction(); return; }
  touch.active = true;
  touch.id = e.pointerId;
  touch.ox = touch.x = px;
  touch.oy = touch.y = py;
});
canvas.addEventListener('pointermove', function (e) {
  var rm = canvas.getBoundingClientRect();

  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.max(0.8, Math.min(1.5, Math.min(W, H) / 480));
  readSafeArea();
  setArena();

  var n = Math.floor(W * H / 26000);

    stars.push({ x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 1.2, ph: Math.random() * Math.PI * 2, sp: 0.4 + Math.random() * 1.2 });
  }

// ---------------- game setup ----------------
function startGame(m, lvlIdx) {
  mode = m;
  levelIndex = lvlIdx || 0;
  levelResult = null;
  var lvl = (mode === 'level') ? LVLS[levelIndex] : null;
  loopDur = (lvl && lvl.loopDur) ? lvl.loopDur : CFG.loopDuration;
  state = 'playing';
  paused = false;
  setArena();
  player = { x: (AR.x0 + AR.x1) / 2, y: (AR.y0 + AR.y1) / 2, vx: 0, vy: 0, trail: [] };
  ghosts = []; orbs = []; particles = []; floaters = []; powerups = [];
  recording = []; loopTimer = 0; loopCount = 0; ghostClock = 0;
  score = 0; combo = 1; comboTimer = 0;
  orbsCollected = 0; survivalTime = 0; grazes = 0;
  shake = 0; flashAlpha = 0; dangerLevel = 0; gridPulse = 0;
  freezeUntil = 0; phaseUntil = 0; slowUntil = 0; bountyUntil = 0;

  newBest = false; newUnlock = null; deathInfo = null; dyingT = 0;
  skinView = skinIndex;

}
function safeSpot(minPlayerDist, nearGhostBias) {
  var x, y, ok, tries = 0;
  do {
    ok = true;
    if (nearGhostBias && ghosts && ghosts.length > 0 && Math.random() < nearGhostBias) {
      var g = ghosts[Math.floor(Math.random() * ghosts.length)];
      var pt = g.path[Math.floor(Math.random() * g.path.length)];
      var an = Math.random() * Math.PI * 2;
      var rr = 60 + Math.random() * 50;
      x = pt.x + Math.cos(an) * rr;
      y = pt.y + Math.sin(an) * rr;
    } else {
      x = AR.x0 + 50 + Math.random() * (AR.x1 - AR.x0 - 100);
      y = AR.y0 + 70 + Math.random() * (AR.y1 - AR.y0 - 140);
    }
    if (x < AR.x0 + 30 || x > AR.x1 - 30 || y < AR.y0 + 30 || y > AR.y1 - 30) ok = false;
    if (ok && player && Math.hypot(x - player.x, y - player.y) < minPlayerDist) ok = false;
    if (ok && ghosts) {
      for (var i = 0; i < ghosts.length; i++) {
        if (Math.hypot(x - ghosts[i].x, y - ghosts[i].y) < 80) { ok = false; break; }
      }
    }

}

  var p = safeSpot(140, bias);
  orbs.push({ x: p.x, y: p.y, phase: Math.random() * Math.PI * 2 });
}
function spawnPowerup() {
  var p = safeSpot(160, 0);
  var type = PTYPES[Math.floor(Math.random() * PTYPES.length)];
  powerups.push({ x: p.x, y: p.y, type: type, born: elapsed, rot: 0 });
}
function burst(x, y, color, n, speed) {
  var cap = lowFX ? 100 : 220;

    var a = Math.random() * Math.PI * 2;
    var s = (0.3 + Math.random() * 0.7) * speed;

}
function floatText(x, y, text, color, big) {

// ---------------- ghost replay ----------------
function ghostPos(g, t) {
  var path = g.path;
  var T = t % g.duration;
  var lo = 0, hi = path.length - 1;
  if (T <= path[0].t) return { x: path[0].x, y: path[0].y };
  if (T >= path[hi].t) {
    var a1 = path[hi], b1 = path[0];
    var span = g.duration - a1.t + b1.t || 0.0001;
    var f1 = (T - a1.t) / span;
    return { x: a1.x + (b1.x - a1.x) * f1, y: a1.y + (b1.y - a1.y) * f1 };
  }
  while (lo < hi - 1) {
    var mid = (lo + hi) >> 1;
    if (path[mid].t <= T) lo = mid; else hi = mid;
  }
  var a = path[lo], b = path[hi];
  var f = (T - a.t) / ((b.t - a.t) || 0.0001);
  return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
}
function ghostSpeedMult() {
  var m = 1;
  if (mode === 'classic') m *= 1 + Math.min(0.3, Math.floor(loopCount / CFG.milestoneEvery) * 0.03);
  if (mode === 'level' && LVLS[levelIndex].fast) m *= LVLS[levelIndex].fast;
  if (elapsed < slowUntil) m *= 0.6;

}

  for (var gi = 0; gi < ghosts.length; gi++) {
    var g = ghosts[gi];
    var age = ghostClock - g.born;
    var gp = ghostPos(g, age);
    g.x = gp.x; g.y = gp.y;
    g.age = age;
  }
}
function pushGhost(path) {
  ghosts.push({ path: path, duration: loopDur, born: ghostClock, hue: (loopCount * 47) % 360, lastGraze: -9, x: player.x, y: player.y, age: 0, mirror: false });
  if (mode === 'level' && LVLS[levelIndex].mirror) {
    var mp = [];
    for (var i = 0; i < path.length; i++) mp.push({ t: path[i].t, x: W - path[i].x, y: path[i].y });
    ghosts.push({ path: mp, duration: loopDur, born: ghostClock, hue: 140, lastGraze: -9, x: W - player.x, y: player.y, age: 0, mirror: true });
  }
  if (mode === 'classic' && ghosts.length > CFG.ghostCap) {
    var old = ghosts.shift();
    sfx.ghostFade();
    burst(old.x, old.y, [200, 200, 230], 16, 120);
    floatText(old.x, old.y - 20, 'GHOST FADED', 'rgba(200,200,230,1)');
  }
}

// ---------------- effects ----------------
function updateEffects(dt) {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (var j = floaters.length - 1; j >= 0; j--) {
    var f = floaters[j];
    f.y -= 40 * dt; f.life -= dt * (f.big ? 0.6 : 0.9);
    if (f.life <= 0) floaters.splice(j, 1);
  }

  flashAlpha = Math.max(0, flashAlpha - dt * 1.2);
  gridPulse = Math.max(0, gridPulse - dt * 1.5);
}
function updateDrone() {
  if (!droneGain) return;
  var target = 0;
  if (musicIndex === 0 && state === 'playing' && !paused && ghosts) {
    target = Math.min(ghosts.length / 8, 1) * 0.045;
    if (elapsed < freezeUntil) target *= 0.4;
  }
  droneGain.gain.value += (target - droneGain.gain.value) * 0.08;
  if (droneOscs.length === 2 && ghosts) {
    droneOscs[1].frequency.value = 55.7 + Math.min(ghosts.length, 10) * 0.35;
  }

// ---------------- update ----------------
function update(dt) {

  }
  if (state === 'menu' || state === 'levels') return;
  if (paused) return;

    advanceGhosts(dt * 0.22);
    updateEffects(dt * 0.5);
    dyingT += dt;
    if (dyingT >= 1.0) { state = 'dead'; deadAt = elapsed; }
    return;
  }
  if (state === 'dead') { updateEffects(dt); return; }

  survivalTime += dt;
  score += dt * 2 * combo;
  if (tutT >= 0) {
    tutT += dt;

    }

  if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
  if (touch.active) {
    var tdx = touch.x - touch.ox, tdy = touch.y - touch.oy;
    var td = Math.hypot(tdx, tdy);

  player.vy -= player.vy * CFG.friction * controlF * dt;
  var sp = Math.hypot(player.vx, player.vy);

  player.y += player.vy * dt;
  player.x = Math.max(AR.x0 + CFG.playerRadius, Math.min(AR.x1 - CFG.playerRadius, player.x));

  player.trail.push({ x: player.x, y: player.y, life: 1 });
  if (player.trail.length > 24) player.trail.shift();

  }

    pushGhost(recording);

    flashAlpha = 0.35;
    gridPulse = 1;

    burst(player.x, player.y, [255, 80, 120], 18, 160);
    if (mode === 'classic' && loopCount % CFG.milestoneEvery === 0) {
      score += CFG.milestoneBonus;
      sfx.milestone();

  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1.5;
  rrect(rBtn.x, rBtn.y, rBtn.w, rBtn.h, 8);
  ctx.fill(); ctx.stroke();
  ctx.font = bfontPx(10);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('RESET', rBtn.x + rBtn.w / 2, rBtn.y + rBtn.h / 2 + 1);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
  yy += 46;
  for (var sk = 0; sk < SKINS.length; sk++) {
    var skx = cx + (sk - (SKINS.length - 1) / 2) * 52;
    var skLocked = best < SKINS[sk].unlock;
    drawPlayerBall(skx, yy, 11, skLocked ? 0.32 : (sk === skinView ? 1 : 0.7), sk);
    if (sk === skinView) {
      ctx.strokeStyle = skLocked ? 'rgba(255,120,150,0.8)' : 'rgba(80,230,255,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(skx, yy, 18, 0, Math.PI * 2); ctx.stroke();
    }
    if (sk === skinIndex && sk !== skinView) {
      ctx.fillStyle = 'rgba(140,255,180,0.8)';
      ctx.beginPath(); ctx.arc(skx, yy + 22, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  yy += 34 * S;
  ctx.font = bfontPx(14);
  ctx.fillStyle = 'rgba(255,215,80,0.85)';
  ctx.fillText('HIGH SCORE ' + best.toLocaleString() + '  ·  ' + bestLoops + ' LOOPS SURVIVED', cx, yy);
  ctx.font = fontPx(11);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText(GLVERSION, cx, H - SAFE.bottom - 14);
}
function drawLevels() {
  ctx.textAlign = 'center';
  var cx = W / 2;
  ctx.save();
  ctx.shadowBlur = 24; ctx.shadowColor = 'rgba(140,255,180,0.7)';
  ctx.font = bfontPx(30);
  ctx.fillStyle = 'rgba(140,255,180,0.95)';
  ctx.fillText('LEVELS', cx, SAFE.top + 60 * S);
  ctx.restore();
  ctx.font = fontPx(12);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('survive the loops, collect the orbs', cx, SAFE.top + 84 * S);
  var cols = 5, rows = Math.ceil(LVLS.length / cols);
  var gap = 10;
  var gy0 = SAFE.top + 104 * S;
  var availW = W - SAFE.left - SAFE.right - 50;
  var availH = H - gy0 - SAFE.bottom - 24;
  var cell = Math.min((availW - gap * (cols - 1)) / cols, (availH - gap * (rows - 1)) / rows, 84 * S);
  cell = Math.max(cell, 40);
  var gw = cell * cols + gap * (cols - 1);
  var gx0 = cx - gw / 2;
  var showTags = cell >= 62;
  for (var i = 0; i < LVLS.length; i++) {
    var r = Math.floor(i / cols), c = i % cols;
    var x = gx0 + c * (cell + gap), y = gy0 + r * (cell + gap);
    var unlocked = i < levelMax;
    var beaten = i < levelMax - 1;
    var b = { x: x, y: y, w: cell, h: cell, idx: i };
    ctx.save();
    ctx.fillStyle = beaten ? 'rgba(140,255,180,0.16)' : (unlocked ? 'rgba(80,230,255,0.12)' : 'rgba(255,255,255,0.04)');
    ctx.strokeStyle = beaten ? 'rgba(140,255,180,0.7)' : (unlocked ? 'rgba(80,230,255,0.7)' : 'rgba(255,255,255,0.13)');
    ctx.lineWidth = 2;
    rrect(x, y, cell, cell, 10);
    ctx.fill(); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = bfontPx(cell >= 62 ? 20 : 15);
    ctx.fillStyle = unlocked ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.22)';
    ctx.fillText(String(i + 1), x + cell / 2, y + cell / 2 + (showTags ? -2 : 5));
    if (showTags) {
      var lv = LVLS[i];
      var tags = [];
      if (lv.mirror) tags.push('MIR');
      if (lv.fog) tags.push('FOG');
      if (lv.small) tags.push('SML');
      if (lv.fast) tags.push('FST');
      if (lv.loopDur) tags.push(lv.loopDur + 's');
      ctx.font = fontPx(8);
      ctx.fillStyle = unlocked ? 'rgba(140,255,180,0.65)' : 'rgba(255,255,255,0.15)';
      ctx.fillText(unlocked ? (tags.join(' ') || 'INTRO') : 'LOCK', x + cell / 2, y + cell - 8);
    }
    ctx.restore();
    if (unlocked) {
      (function (idx) {
        b.fn = function () { startGame('level', idx); };
      })(i);
      buttons.push(b);
    }
  }
}
function drawPaused() {
  ctx.fillStyle = 'rgba(7,7,14,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = bfontPx(36);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('PAUSED', W / 2, H / 2 - 60);
  ctx.font = fontPx(14);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('tap anywhere or press P to resume', W / 2, H / 2 - 28);
  var bw = Math.min(W * 0.7, 300), bh = 50;
  var mBtn = { x: W / 2 - bw / 2, y: H / 2, w: bw, h: bh, label: 'MUSIC: ' + MUSIC[musicIndex].name, fn: cycleMusic };
  buttons.push(mBtn); drawTextButton(mBtn, false);
  var qBtn = { x: W / 2 - bw / 2, y: H / 2 + bh + 12, w: bw, h: bh, label: 'QUIT TO MENU', fn: function () { paused = false; goMenu(); } };
  buttons.push(qBtn); drawTextButton(qBtn, false);
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(7,7,14,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  var cx = W / 2, cy = H / 2;
  var isClear = levelResult === 'clear';
  ctx.save();
  ctx.shadowBlur = 25;
  ctx.shadowColor = isClear ? 'rgba(140,255,180,0.8)' : 'rgba(255,80,120,0.8)';
  ctx.font = bfontPx(isClear ? 36 : 32);
  ctx.fillStyle = isClear ? 'rgba(140,255,180,0.95)' : 'rgba(255,90,130,0.95)';
  ctx.fillText(isClear ? 'LEVEL ' + (levelIndex + 1) + ' CLEAR' : 'CAUGHT BY YOURSELF', cx, cy - 118 * S);
  ctx.restore();
  ctx.font = fontPx(13);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  if (isClear) ctx.fillText(levelIndex + 1 >= LVLS.length ? 'ALL LEVELS CLEARED. YOU BEAT YOURSELF.' : 'your past never stood a chance', cx, cy - 90 * S);
  else if (mode === 'level') ctx.fillText('Ghost #' + deathInfo.byLoop + (deathInfo.mirror ? ' (MIRROR)' : '') + ' got you', cx, cy - 90 * S);
  else ctx.fillText('Ghost #' + deathInfo.byLoop + ' got you', cx, cy - 90 * S);
  ctx.font = bfontPx(32);
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.floor(score).toLocaleString(), cx, cy - 46 * S);
  ctx.font = fontPx(11);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText(mode === 'classic' ? 'SCORE · BEST ' + best.toLocaleString() : 'SCORE', cx, cy - 28 * S);
  var infoY = cy - 4 * S;
  if (mode === 'classic') {
    if (newUnlock) {
      ctx.font = bfontPx(17);
      ctx.fillStyle = 'rgba(140,255,180,' + (0.6 + 0.4 * Math.sin(elapsed * 6)) + ')';
      ctx.fillText('NEW BALL UNLOCKED: ' + newUnlock, cx, infoY);
      infoY += 26;
    } else if (newBest) {
      ctx.font = bfontPx(16);
      ctx.fillStyle = 'rgba(255,215,80,' + (0.6 + 0.4 * Math.sin(elapsed * 6)) + ')';
      ctx.fillText('NEW BEST', cx, infoY);
      infoY += 24;
    }
  }
  ctx.font = fontPx(13);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(loopCount + ' loops · ' + orbsCollected + ' orbs · ' + grazes + ' grazes · ' + survivalTime.toFixed(1) + 's', cx, infoY);
  infoY += 22;
  if (mode === 'classic') {
    var next = null;
    for (var i = 0; i < SKINS.length; i++) { if (best < SKINS[i].unlock) { next = SKINS[i]; break; } }
    if (next) {
      ctx.font = fontPx(12);
      ctx.fillStyle = 'rgba(140,220,255,0.6)';
      ctx.fillText('next ball "' + next.name + '" at ' + next.unlock.toLocaleString(), cx, infoY);
    }
  }
  if (elapsed - deadAt > 0.5) {
    var bw = Math.min(W * 0.72, 300), bh = 52;
    var label1 = 'LOOP AGAIN';
    if (mode === 'level') label1 = isClear ? (levelIndex + 1 < LVLS.length ? 'NEXT LEVEL' : 'REPLAY FINALE') : 'RETRY LEVEL';
    var b1 = { x: cx - bw / 2, y: cy + 52 * S, w: bw, h: bh, label: label1, fn: retryCurrent };
    var b2;
    if (mode === 'level') b2 = { x: cx - bw / 2, y: cy + 52 * S + bh + 14, w: bw, h: bh, label: 'LEVEL SELECT', fn: goLevels };
    else b2 = { x: cx - bw / 2, y: cy + 52 * S + bh + 14, w: bw, h: bh, label: 'SHARE SCORE', fn: shareScore };
    var b3 = { x: cx - bw / 2, y: cy + 52 * S + (bh + 14) * 2, w: bw, h: bh, label: 'MENU', fn: goMenu };
    buttons.push(b1); buttons.push(b2); buttons.push(b3);
    drawTextButton(b1, true);
    drawTextButton(b2, false);
    drawTextButton(b3, false);
  }
}
function frame(ts) {
  var raw = (ts - lastTime) / 1000 || 0.016;
  lastTime = ts;
  raw = Math.min(raw, 0.25);
  emaFt = emaFt * 0.95 + raw * 0.05;
  if (!lowFX && elapsed > 5 && emaFt > 0.05) {
    lowFX = true;
    resize();
  }
  if (window.visualViewport && (window.visualViewport.offsetTop > 1 || window.visualViewport.offsetLeft > 1)) { try { window.scrollTo(0, 0); } catch (e2) {} }
  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  accum += raw;
  var steps = 0;
  while (accum >= FIXED_DT && steps < 8) {
    update(FIXED_DT);
    accum -= FIXED_DT;
    steps++;
  }
  if (steps >= 8) accum = 0;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
